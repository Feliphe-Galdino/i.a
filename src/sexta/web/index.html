<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sexta-Feira</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/css/hud.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <div class="hud-bg" aria-hidden="true"></div>

  <!-- Tela de acesso (sem token) -->
  <section id="login" class="login hidden" aria-labelledby="login-title">
    <div class="login-card panel">
      <div class="core core-lg idle" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <h1 id="login-title" class="brand">SEXTA-FEIRA</h1>
      <p>Cole o token de acesso exibido no terminal ao iniciar o servidor<br>(ou rode <code>sexta token</code>).</p>
      <form id="login-form">
        <input id="login-token" type="password" autocomplete="off" placeholder="Token de acesso" aria-label="Token de acesso" required>
        <button class="btn primary" type="submit">Conectar</button>
      </form>
      <p id="login-error" class="error-text" role="alert"></p>
    </div>
  </section>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand-wrap">
        <div id="mini-core" class="core core-sm idle" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
        <div>
          <div class="brand">SEXTA-FEIRA</div>
          <div class="brand-sub" id="brand-sub">inicializando…</div>
        </div>
      </div>
      <div class="chips" id="status-chips">
        <span class="chip" id="chip-conn" title="Conexão em tempo real"><span class="dot"></span><span class="label">Conectando</span></span>
        <span class="chip hide-sm" id="chip-provider" title="Provedor de IA">—</span>
        <span class="chip hide-sm" id="chip-autonomy" title="Nível de autonomia">—</span>
        <span class="chip hide-md" id="chip-cpu" title="Uso de CPU">CPU —</span>
        <span class="chip hide-md" id="chip-ram" title="Uso de memória RAM">RAM —</span>
        <span class="chip hide-xs" id="chip-cost" title="Gasto de API hoje / orçamento diário">US$ —</span>
      </div>
      <button id="voice-btn" class="btn voice-btn" type="button" data-state="off" aria-label="Voz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span class="label">Voz</span>
      </button>
      <button id="panic-btn" class="btn danger panic" title="Interrompe todas as tarefas e muda para o modo Restrito">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        <span>PARAR</span>
      </button>
    </header>

    <nav class="rail" aria-label="Navegação principal">
      <a href="#/chat" data-view="chat" title="Chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Chat</span></a>
      <a href="#/painel" data-view="painel" title="Painel"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg><span>Painel</span></a>
      <a href="#/mundo" data-view="mundo" title="Mundo: notícias, mercado, clima e alertas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Mundo</span></a>
      <a href="#/memoria" data-view="memoria" title="Memória"><svg viewBox="0 0 24 24"><path d="M9 3a4 4 0 0 0-4 4v1a3 3 0 0 0 0 6v1a4 4 0 0 0 4 4h1V3zM15 3a4 4 0 0 1 4 4v1a3 3 0 0 1 0 6v1a4 4 0 0 1-4 4h-1V3z"/></svg><span>Memória</span></a>
      <a href="#/atividade" data-view="atividade" title="Atividade"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Atividade</span></a>
      <a href="#/config" data-view="config" title="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Config.</span></a>
    </nav>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="voice-overlay" class="voice-overlay hidden" role="status" aria-live="polite">
    <div class="core core-sm listening" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
    <div><div class="state"></div><div class="transcript"></div></div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
