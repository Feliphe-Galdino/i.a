[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sexta-feira"
version = "0.3.0"
description = "Sexta-Feira — assistente pessoal de IA com roteamento de modelos, memória persistente e automação segura"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psutil>=5.9",
    "numpy>=1.26",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Voz local no PC: microfone, ativação offline (Vosk), transcrição (Whisper), voz do Windows
voz = [
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
    "faster-whisper>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
]
# Memória semântica (embeddings locais multilíngues)
memoria = ["fastembed>=0.4"]
# Automação de sites (usa o Edge/Chrome já instalado no Windows)
web = ["playwright>=1.45"]
completo = [
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
    "faster-whisper>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
    "fastembed>=0.4",
    "playwright>=1.45",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
sexta = "sexta.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sexta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
